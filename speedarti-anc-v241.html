  function mergeDeep(base,value){
    if(Array.isArray(base)) return Array.isArray(value)?clone(value):clone(base);
    if(base&&typeof base==='object'){
      const out={};const src=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
      Object.keys(base).forEach(k=>out[k]=mergeDeep(base[k],src[k]));
      Object.keys(src).forEach(k=>{if(!(k in out))out[k]=clone(src[k])});
      return out;
    }
    return value===undefined?base:value;
  }

  function idbSave(payload){try{const req=indexedDB.open('speedarti-anc',2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('studies'))db.createObjectStore('studies')};req.onsuccess=()=>{const db=req.result,tx=db.transaction('studies','readwrite');tx.objectStore('studies').put(payload,'current');tx.oncomplete=()=>db.close()}}catch(e){}}
  function recoverFromIndexedDb(){
    if(DEMO_MODE||safeGet())return;
    try{const req=indexedDB.open('speedarti-anc',2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('studies'))db.createObjectStore('studies')};req.onsuccess=()=>{const db=req.result,tx=db.transaction('studies','readonly'),get=tx.objectStore('studies').get('current');get.onsuccess=()=>{try{if(get.result){state=normalize(JSON.parse(get.result));render()}}catch(e){}db.close()}}}catch(e){}
  }

  function setPath(obj,path,value){const parts=path.split('.');let cur=obj;for(let i=0;i<parts.length-1;i++){const key=parts[i];cur=cur[key]??(cur[key]={})}cur[parts.at(-1)]=value}
  function getPath(obj,path){return path.split('.').reduce((a,k)=>a?.[k],obj)}

  function input(path,label,opts={}){const v=getPath(state,path)??'';const type=opts.type||'text';return `<div class="field ${opts.class||''}"><label>${label}</label><input class="input" type="${type}" data-path="${path}" data-value-type="${opts.valueType||''}" value="${esc(v)}" ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}></div>`}
  function textarea(path,label,rows=4,cls=''){return `<div class="field ${cls}"><label>${label}</label><textarea class="textarea" rows="${rows}" data-path="${path}">${esc(getPath(state,path)??'')}</textarea></div>`}
  function select(path,label,options,cls=''){const v=getPath(state,path);return `<div class="field ${cls}"><label>${label}</label><select class="select" data-path="${path}">${options.map(o=>`<option value="${o[0]}" ${String(v)===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
  function toggle(path,label,desc=''){const on=!!getPath(state,path);return `<button type="button" class="toggle ${on?'on':''}" data-toggle="${path}"><span><strong>${label}</strong>${desc?`<small>${desc}</small>`:''}</span><span class="switch"><i></i></span></button>`}
  const ynOpts=[['unknown','À vérifier'],['yes','Oui'],['no','Non']];

  function render(){
    document.documentElement.dataset.tab=state.activeTab;
    $('#app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">S</div><div><strong>SpeedArti ANC</strong><small>V2.4.1 auditée — MODE DÉMONSTRATION · build 28/07/2026</small></div></div><div class="top-actions"><span class="save-state">✓ Sauvegardé localement</span><button class="btn success" data-action="generate-all">⚡ Tout calculer</button><button class="btn secondary" data-action="demo">Charger la démo</button><button class="btn secondary" data-action="import-json">Importer</button><button class="btn secondary" data-action="export-json">Sauvegarde JSON</button><button class="btn primary" data-action="print">Exporter PDF</button></div></header>${renderTabs()}<main class="main">${renderClients()}${renderDossier()}${renderTerrain()}${renderSondages()}${renderPorchet()}${renderGeometry()}${renderPhotos()}${renderMaps()}${renderAutomation()}${renderValidation()}${renderReport()}</main>${renderMapModal()}</div>`;
    bind();
    if(state.activeTab==='rapport') renderReportPages();

  function renderTabs(){const tabs=[['clients','👥','Clients'],['dossier','🏠','Dossier'],['terrain','📋','Fiche chantier'],['sondages','⛏️','Sondages'],['porchet','🧪','Porchet'],['geometrie','📐','Calculs métriques'],['photos','📷','Photos'],['cartes','🗺️','Cartographie'],['automatisation','✨','Automatisation'],['controles','✅','Contrôles'],['rapport','📄','Rapport']];return `<nav class="tabs">${tabs.map(t=>`<button class="tab ${state.activeTab===t[0]?'active':''}" data-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`}

  function renderGeometry(){
    const r=geometryResults();
    const result=(label,value,status='warn')=>`<div class="metric-result ${status}"><strong>${value}</strong><span>${label}</span></div>`;
    const metrics=`<div class="metric-results">${result('Surface parcelle',r.parcelArea!==undefined?`${fmt(r.parcelArea,1)} m²`:'—',r.parcelArea?'ok':'warn')}${result('Zone disponible',r.availableArea!==undefined?`${fmt(r.availableArea,1)} m²`:'—',r.availableArea?'ok':'warn')}${result('Maison → filière',r.houseDistance!==undefined?`${fmt(r.houseDistance,1)} m`:'—',r.houseCompliant?'ok':'fail')}${result('Filière → limite',r.boundaryDistance!==undefined?`${fmt(r.boundaryDistance,1)} m`:'—',r.boundaryCompliant?'ok':'fail')}${result('Pente canalisation',r.pipeSlopePct!==undefined?`${fmt(r.pipeSlopePct,2)} %`:'—',r.pipeSlopeCompliant?'ok':'fail')}</div>`;
    const object=(key,title)=>{const o=state.geometry.objects[key];return `<div class="metric-object"><h3>${title}</h3><div class="grid g2">${dynInput(`geometry.objects.${key}.x`,'X (m)',o.x,'number')}${dynInput(`geometry.objects.${key}.y`,'Y (m)',o.y,'number')}</div>${toggle(`geometry.objects.${key}.enabled`,'Activer')}</div>`};
    const body=metrics+`<div class="metric-layout"><article class="card"><div class="card-body">${metricPlanSvg()}<div class="metric-legend"><span><i style="background:#405f7b"></i>Maison</span><span><i style="background:#168ceb"></i>Filière</span><span><i style="background:#d64141"></i>Puits</span><span><i style="background:#4b9139"></i>Arbre</span><span><i style="background:#a56b27"></i>Exutoire</span></div></div></article><div class="grid"><article class="card"><div class="card-body"><div class="grid g2">${input('geometry.width','Largeur du repère (m)',{type:'number',valueType:'number'})}${input('geometry.height','Hauteur du repère (m)',{type:'number',valueType:'number'})}</div>${textarea('geometry.parcelPolygon','Polygone parcelle — x,y ; x,y…',3)}${textarea('geometry.availablePolygon','Polygone zone disponible — x,y ; x,y…',3)}<div class="grid g2">${input('geometry.pipeElevationStart','Cote sortie maison (m)',{type:'number',valueType:'number'})}${input('geometry.pipeElevationEnd','Cote entrée filière (m)',{type:'number',valueType:'number'})}</div><div class="notice info">Les coordonnées sont exprimées en mètres dans un repère local. La production connectée utilisera Lambert-93 / GeoJSON.</div></div></article><article class="card"><div class="card-body"><div class="metric-object-grid">${object('house','Maison')}${object('filiere','Filière ANC')}${object('well','Puits / captage')}${object('tree','Arbre / végétation')}${object('outlet','Exutoire / fossé')}</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-action="apply-geometry">Recalculer et reporter</button><button class="btn secondary" data-action="generate-metric-maps">Générer les annexes métriques</button></div></div></article></div></div>`;
    return sec('geometrie','📐','Surfaces, distances et pentes automatiques','Le plan métrique calcule les surfaces, les distances réglementaires, la pente de canalisation et prépare les annexes 1 et 2.',body);
  }

  function renderTerrain(){
    const constraints=[['health','Zone à enjeux sanitaires'],['catchment','Périmètre de protection de captage'],['well35','Puits à moins de 35 m'],['wellDrink','Puits destiné à la consommation'],['water','Cours d’eau / plan d’eau / fossé'],['flood','Zone inondable'],['wetland','Zone humide'],['groundwater','Remontée de nappe'],['networks','Réseaux contraignants']];

  function renderSondages(){
    const list=state.boreholes.length?`<div class="item-list">${state.boreholes.map((b,i)=>renderBorehole(b,i)).join('')}</div>`:`<div class="notice info">Aucun sondage. Ajoutez S1, S2, S3… sans limite fixe.</div>`;

  function renderBorehole(b,i){return `<article class="item-card"><div class="item-card-head"><strong>Sondage ${esc(b.label)}</strong><div><button class="icon-btn" data-action="duplicate-borehole" data-index="${i}">⧉</button> <button class="icon-btn red" data-action="delete-borehole" data-index="${i}">✕</button></div></div><div class="item-card-body"><div class="grid g4">${dynInput(`boreholes.${i}.label`,'Identifiant',b.label)}${dynInput(`boreholes.${i}.slope`,'Pente (%)',b.slope,'number')}${dynInput(`boreholes.${i}.depth`,'Profondeur atteinte (m)',b.depth,'number')}${dynInput(`boreholes.${i}.blocked`,'Blocage (cm)',b.blocked,'number')}${dynInput(`boreholes.${i}.classification`,'Classification AFES / INRA',b.classification)}${dynInput(`boreholes.${i}.substrate`,'Substratum rocheux',b.substrate)}${dynInput(`boreholes.${i}.method`,'Moyen utilisé',b.method,'text','span2')}${dynInput(`boreholes.${i}.blocking`,'Raison du blocage',b.blocking,'text','span2')}${dynTextarea(`boreholes.${i}.notes`,'Observations',b.notes,3,'span2')}</div><div class="item-card-head" style="margin:14px -14px 0"><strong>Horizons de sol</strong><button class="btn secondary small" data-action="add-horizon" data-index="${i}">+ Horizon</button></div>${b.horizons.map((h,j)=>renderHorizon(h,i,j)).join('')}</div></article>`}
  function dynInput(path,label,value,type='text',cls=''){return `<div class="field ${cls}"><label>${label}</label><input class="input" type="${type}" data-path="${path}" data-value-type="${type==='number'?'number':''}" value="${esc(value??'')}"></div>`}
  function dynTextarea(path,label,value,rows=3,cls=''){return `<div class="field ${cls}"><label>${label}</label><textarea class="textarea" rows="${rows}" data-path="${path}">${esc(value??'')}</textarea></div>`}
  function renderHorizon(h,i,j){return `<div class="horizon"><span class="horizon-num">${j+1}</span>${dynInput(`boreholes.${i}.horizons.${j}.from`,'De cm',h.from,'number')}${dynInput(`boreholes.${i}.horizons.${j}.to`,'À cm',h.to,'number')}${dynInput(`boreholes.${i}.horizons.${j}.code`,'Code',h.code)}${dynInput(`boreholes.${i}.horizons.${j}.soil`,'Type de sol',h.soil)}${dynInput(`boreholes.${i}.horizons.${j}.color`,'Couleur',h.color)}<button class="icon-btn red" data-action="delete-horizon" data-bi="${i}" data-hi="${j}">✕</button><div class="horizon-details">${dynInput(`boreholes.${i}.horizons.${j}.texture`,'Texture',h.texture)}${dynInput(`boreholes.${i}.horizons.${j}.structure`,'Structure',h.structure)}${dynInput(`boreholes.${i}.horizons.${j}.stones`,'Pierrosité',h.stones)}${dynInput(`boreholes.${i}.horizons.${j}.density`,'Densité / charge',h.density)}${dynInput(`boreholes.${i}.horizons.${j}.hydromorphy`,'Hydromorphie',h.hydromorphy)}</div></div>`}

  function renderPorchet(){
    const studyK=studyPermeability(),decision=permeabilityDecision(studyK);
    const header=card('Paramètres de calcul de l’étude','Les seuils et la règle de valeur représentative sont configurables et doivent être validés par Frédéric avant usage officiel.',`<div class="porchet-header">${select('porchetSettings.studyRetention','Valeur retenue pour l’étude',[['minimum','Minimum des tests'],['median','Médiane'],['mean','Moyenne']])}${input('porchetSettings.stabilityCvPct','Stabilité max CV (%)',{type:'number',valueType:'number'})}${input('porchetSettings.treatmentMin','Seuil traitement par le sol (mm/h)',{type:'number',valueType:'number'})}${input('porchetSettings.infiltrationMin','Seuil infiltration effluent traité (mm/h)',{type:'number',valueType:'number'})}${input('porchetSettings.maxPermeability','Seuil réglementaire haut (mm/h)',{type:'number',valueType:'number'})}${input('porchetSettings.deviceMaxPermeability','Plage instrumentale max (mm/h)',{type:'number',valueType:'number'})}</div>${toggle('porchetSettings.formulaValidated','Protocole et formule validés par Frédéric','Le calcul reste signalé comme provisoire tant que les paramètres exacts de l’appareil SDEC ne sont pas confirmés.')}${input('porchetSettings.formulaValidationNote','Référence / note de validation du protocole')}${input('porchetSettings.formulaValidationDate','Date de validation',{type:'date'})}<div class="porchet-kpis"><div class="porchet-kpi"><strong>${studyK!==undefined?`${fmt(studyK,2)} mm/h`:'—'}</strong><span>Valeur représentative de l’étude</span></div><div class="porchet-kpi"><strong>${decision.treatmentShort}</strong><span>Traitement par le sol</span></div><div class="porchet-kpi"><strong>${decision.infiltrationShort}</strong><span>Infiltration de l’effluent traité</span></div><div class="porchet-kpi"><strong>${state.porchets.length}</strong><span>Tests enregistrés</span></div></div><div class="formula-box"><b>Essai à niveau constant :</b> <code>K = V / (S × t) × 600</code>, avec V en mL, S = πr² + 2πrh en cm², t en minutes et K en mm/h. Les relevés successifs sont calculés séparément, puis la valeur retenue suit la règle choisie.</div>`);
    const list=state.porchets.length?`<div class="item-list">${state.porchets.map((p,i)=>renderPorchetTest(p,i)).join('')}</div>`:`<div class="notice info">Aucun test de Porchet enregistré.</div>`;
    return sec('porchet','🧪','Tests de Porchet calculés','Saisie des mesures brutes, calcul automatique de K, contrôle de stabilité et double aptitude traitement / infiltration.',header+list,`<button class="btn secondary" data-action="recalc-porchet">Recalculer tous les tests</button><button class="btn primary" data-action="add-porchet">+ Ajouter un test</button>`)

  function renderValidation(){const issues=validate();const counts={error:issues.filter(i=>i.sev==='error').length,warning:issues.filter(i=>i.sev==='warning').length,info:issues.filter(i=>i.sev==='info').length};const body=`<div class="validation-summary"><div class="stat"><strong>${completion()}%</strong><span>complétude estimée</span></div><div class="stat"><strong style="color:var(--red)">${counts.error}</strong><span>erreurs bloquantes</span></div><div class="stat"><strong style="color:var(--orange)">${counts.warning}</strong><span>avertissements</span></div><div class="stat"><strong style="color:var(--green)">${state.solution.validated?'OUI':'NON'}</strong><span>validation professionnelle</span></div></div>${card('Contrôles automatiques','Les contrôles recherchent les champs manquants, les incohérences, les cartes absentes et les annexes conditionnelles.',issues.length?`<div class="validation-list">${issues.map(i=>`<div class="issue ${i.sev}"><span class="sev">${i.sev}</span><span class="where">${esc(i.where)}</span><span>${esc(i.text)}</span></div>`).join('')}</div>`:'<div class="notice good">Aucun problème détecté. La validation professionnelle reste nécessaire.</div>')}${card('Validation finale','Cette action engage la responsabilité du bureau d’études.',`${input('solution.validatedBy','Validé par')}${textarea('solution.validationNote','Note de validation / réserves',3)}${toggle('solution.validated','Je valide professionnellement la solution et la conclusion','À activer seulement après contrôle du rapport complet.')}${state.solution.validated?`<div class="notice good">Validation enregistrée le ${state.solution.validationDate?new Date(state.solution.validationDate).toLocaleString('fr-FR'):'—'} par ${esc(state.solution.validatedBy||'professionnel non identifié')}.</div>`:''}`)}`;return sec('controles','✅','Contrôles et validation','Vérification automatique avant génération Word/PDF.',body,`<button class="btn secondary" data-action="generate">Régénérer les textes</button>`)}

  function bind(){
    $$('.tab[data-tab]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;scheduleSave();render()});
    $$('[data-path]').forEach(el=>{const update=()=>{let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.valueType==='number')v=num(v);setPath(state,el.dataset.path,v);if(el.dataset.path==='solution.evacuation')state.automation.annex3.enabled=v==='infiltration';if(el.dataset.path.startsWith('porchets.'))recalculateAllPorchets();scheduleSave();if(state.activeTab==='rapport')renderReportPages()};el.oninput=update;el.onchange=()=>{update();if(el.dataset.path.startsWith('porchets.')||el.dataset.path.startsWith('geometry.')||el.dataset.path.startsWith('porchetSettings.'))render()}});
    $$('[data-toggle]').forEach(b=>b.onclick=()=>{const p=b.dataset.toggle;setPath(state,p,!getPath(state,p));if(p==='solution.validated')state.solution.validationDate=getPath(state,p)?new Date().toISOString():'';if(p==='porchetSettings.formulaValidated')state.porchetSettings.formulaValidationDate=getPath(state,p)?new Date().toISOString():'';if(p.startsWith('geometry.'))applyGeometryToStudy(state,false);scheduleSave();render()});
    $$('[data-reg-index]').forEach(c=>c.onchange=()=>{state.automation.regulations[+c.dataset.regIndex].enabled=c.checked;scheduleSave()});
    $$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));
    $('#json-import').onchange=importJson;$('#map-import').onchange=importMap;$('#photo-import').onchange=importPhotos;
  }

  function action(a,b){
    if(a==='demo'){if(confirm('Remplacer le dossier actuel par la démonstration complète ?')){state=demoStudy();safeSet(JSON.stringify(state));idbSave(JSON.stringify(state));render()}}

  function reportCover(){const photo=state.photos.find(p=>p.id===state.report.coverPhoto)||state.photos.find(p=>p.category==='cover')||state.photos.find(p=>p.category==='site');return `<div class="cover-brand"><div class="cover-logo"><div class="cover-logo-mark">FL</div><strong>${esc(state.company.name)}</strong></div><div class="cover-company">${nl(state.company.address)}<br>Tél. ${esc(state.company.phone)}<br>${esc(state.company.email)}</div></div><div class="cover-title"><h1>RAPPORT D’ÉTUDE DE CONCEPTION<br>ASSAINISSEMENT NON COLLECTIF</h1></div><div class="cover-client"><strong>${esc(personName())}</strong><br>${esc(state.parcel.address)}, ${esc(state.parcel.postalCode)} ${esc(state.parcel.city)}</div>${photo?`<img class="cover-photo" src="${photo.data}">`:'<div class="cover-photo-placeholder">Photographie principale de la propriété</div>'}<div class="cover-bottom"><strong>Section ${esc(state.parcel.section||'—')} — Parcelle ${esc(state.parcel.number||'—')}</strong><div class="dates"><span>Étude réalisée le <b>${dateFr(state.visit.studyDate)}</b></span><span>Rapport remis le <b>${dateFr(state.visit.deliveryDate)}</b></span></div><div>DEMANDEUR : ${esc(state.owner.requesterSame?personName():state.owner.requester||'—')}</div><div class="bureau">BUREAU D’ÉTUDES TECHNIQUES ASSAINISSEMENT ET GESTION DE L’EAU</div></div>`}
  function reportToc(plan){const entries=plan.filter(p=>p.tocTitle).map((p,i)=>({title:p.tocTitle,page:plan.indexOf(p)+1}));return `<div class="toc"><h1>SOMMAIRE</h1>${entries.map(e=>`<div class="toc-row"><span>${esc(e.title)}</span><i></i><strong>${e.page}</strong></div>`).join('')}<p>Pagination calculée à partir des pages réellement générées.</p></div>`}
  function reportRegulatory(){return `${pageTitle('Rappel réglementaire')}<p>Références enregistrées avec le dossier. Le bureau d’études doit vérifier leur actualité avant signature.</p><ul>${state.automation.regulations.filter(r=>r.enabled).map(r=>`<li><b>${esc(r.title)}</b> — ${esc(r.version)}</li>`).join('')}</ul><h2>Mission du bureau d’études</h2><p>${nl(state.automation.mission)}</p><h2>Le rapport n’a pas pour objet</h2><ul>${state.automation.exclusions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
  function reportContext(){return `${pageTitle('1. Contexte parcellaire')}<h2>1.1 Identification de la demande</h2>${table([['Propriétaire',personName()],['Adresse de la parcelle',`${state.parcel.address}, ${state.parcel.postalCode} ${state.parcel.city}`],['Demandeur',state.owner.requesterSame?personName():state.owner.requester],['Cadre de la demande','Implantation et conception d’une filière ANC'],['Nature des travaux',`${projectLabel()} d’un ANC`]])}<p>${esc(personName())} a fait appel à ${esc(state.company.name)} pour effectuer une étude préalable à l’assainissement non collectif sur la commune de ${esc(state.parcel.city)}.</p><h2>1.2 Identification de l’habitation</h2>${table([['Type de construction',buildingLabel()],['Alimentation en eau potable',yesNo(state.building.water)],['Nombre de sorties d’eaux usées',state.building.outlets],['Particularités',state.building.features]])}`}
  function reportEh(){const eh=calculateEh()||state.building.eh;return `${pageTitle('1.2.1 Dimensionnement de la filière ANC')}<p>Le dimensionnement est proposé selon la méthode sélectionnée puis validé par le professionnel. Les cas particuliers doivent être justifiés.</p><div class="eh-badge"><span>DIMENSIONNEMENT RETENU</span><strong>${eh?`${eh} EH`:'À déterminer'}</strong></div>${table([['Méthode',state.building.sizingMethod==='rooms'?'Nombre de pièces principales':state.building.sizingMethod==='capacity'?'Capacité d’accueil':'Saisie manuelle'],['Pièces principales',state.building.mainRooms],['Capacité / personnes',state.building.occupants],['Coefficient',state.building.coefficient],['Répartition des pièces',state.building.floors],['Justification',state.building.justification]],true)}`}
  function reportParcel(){const photos=state.photos.filter(p=>p.category==='site').slice(0,2);return `${pageTitle('1.3 Identification de la parcelle et contraintes physiques')}${table([['Commune',state.parcel.city],['Coordonnées GPS',`${state.parcel.lat||'—'}° N — ${state.parcel.lng||'—'}° E`],['Altitude',`${state.parcel.altitude||'—'} m`],['Type d’habitat',buildingLabel()],['Surface totale',`${state.parcel.totalArea||'—'} m²`],['Surface disponible ANC',`${state.parcel.availableArea||'—'} m²`],['Pente moyenne / orientation',`${state.parcel.slope||'—'} % — ${state.parcel.slopeDirection||'—'}`],['Présence de réseaux',`${yesNo(state.visit.networks)} ${state.visit.networkDetails}`],['Contraintes d’accès',state.visit.access],['Végétation',state.visit.vegetation]],true)}<h2>Photographies de la zone d’investigation</h2><div class="photo-pair">${photos.length?photos.map(p=>`<figure><img src="${p.data}"><figcaption>${esc(p.caption||p.title)}</figcaption></figure>`).join(''):'<div class="photo-placeholder">Photo terrain 1</div><div class="photo-placeholder">Photo terrain 2</div>'}</div>`}
  function mapBlock(kind,title){const m=state.maps.find(x=>x.kind===kind);return `<div class="report-map"><h2>${esc(title)}</h2>${m?.preview||m?.background?`<img src="${m.preview||m.background}">`:`<div class="report-map-placeholder"><span>${esc(title)}<br><small>Export à produire dans le studio cartographique</small></span></div>`}<div class="report-map-meta"><span>Échelle ${m?.scaleVerified?'vérifiée':'déclarée'} : 1:${Number(m?.scale||0).toLocaleString('fr-FR')}</span><span>${esc(m?.source||'Source à préciser')} ${m?.sourceDate?`— ${esc(m.sourceDate)}`:''}</span></div></div>`}
  function reportLocationMaps(){return `${pageTitle('Localisation et plan cadastral')}${mapBlock('location','Localisation générale de la parcelle')}${mapBlock('cadastral','Plan cadastral de localisation')}`}
  function reportAerial(){return `${pageTitle('Zone d’investigation ANC')}${mapBlock('aerial','Vue aérienne / satellite avec zone disponible')}`}
  function reportConstraints(){const c=state.constraints,txt=x=>`${yesNo(x.value)} ${x.details||''}${x.source?` — source : ${x.source}`:''}${x.date?` (${dateFr(x.date)})`:''}`;return `${pageTitle('1.3.2 Contraintes environnementales')}${table([['Zone à enjeux sanitaires',txt(c.health)],['Périmètre de captage',txt(c.catchment)],['Puits à moins de 35 m',txt(c.well35)],['Puits destiné à la consommation',txt(c.wellDrink)],['Cours d’eau / plan d’eau',txt(c.water)],['Zone inondable',txt(c.flood)],['Zone humide',txt(c.wetland)],['Remontée de nappe',txt(c.groundwater)]])}`}

  function reportBoreSummary(){return `${pageTitle('2. Sondages et tests de perméabilité')}<p>L’étude permet d’appréhender les contraintes afin d’orienter le choix de la filière et le mode d’évacuation.</p>${table([['Date de visite',dateFr(state.visit.studyDate)],['Conditions climatiques',`${state.visit.weather} — tendance J-7 : ${state.visit.weather7}`],['Nombre de sondages',state.boreholes.length],['Moyen utilisé',state.boreholes[0]?.method||'—'],['Profondeur maximale',state.boreholes.length?`${Math.max(...state.boreholes.map(b=>num(b.depth)||0)).toFixed(2)} m`:'—']])}<table class="data-table"><thead><tr><th>Sondage</th><th>Pente</th><th>Profondeur</th><th>Blocage</th></tr></thead><tbody>${state.boreholes.map(b=>`<tr><td>${esc(b.label)}</td><td>${esc(b.slope||'—')} %</td><td>${esc(b.depth||'—')} m</td><td>${b.blocked?`${esc(b.blocked)} cm — ${esc(b.blocking)}`:'Non signalé'}</td></tr>`).join('')}</tbody></table>`}

  function reportBorehole(b){const max=Math.max(120,...b.horizons.map(h=>num(h.to)||0)),linked=state.photos.filter(p=>p.targetType==='borehole'&&p.targetId===b.id).slice(0,2);return `${pageTitle(`Sondage ${esc(b.label)}`)}<p>Classification AFES / INRA : <b>${esc(b.classification||'à compléter')}</b> — Substratum : <b>${esc(b.substrate||'à compléter')}</b></p>${linked.length?`<div class="photo-pair">${linked.map(p=>`<figure><img src="${p.data}"><figcaption>${esc(p.caption||p.title)}</figcaption></figure>`).join('')}</div>`:''}<div class="bore-layout"><div class="bore-column">${b.horizons.map(h=>{const top=(num(h.from)||0)/max*100,height=((num(h.to)||0)-(num(h.from)||0))/max*100;return `<div class="bore-layer ${borePattern(h)}" style="top:${top}%;height:${height}%">${esc(h.code||h.soil)}<br>${esc(h.from)}–${esc(h.to)} cm</div>`}).join('')}</div><table class="bore-table"><thead><tr><th>Horizon</th><th>Profondeur</th><th>Description</th></tr></thead><tbody>${b.horizons.map(h=>`<tr><td>${esc(h.code||h.soil||'—')}</td><td>${esc(h.from)} à ${esc(h.to)} cm</td><td><b>${esc(h.color)} — ${esc(h.texture)}</b><br>Structure : ${esc(h.structure||'—')}<br>Pierrosité : ${esc(h.stones||'—')} / densité : ${esc(h.density||'—')}<br>Hydromorphie : ${esc(h.hydromorphy||'—')}</td></tr>`).join('')}</tbody></table></div>`}
  function reportPorchet(){const k=studyPermeability(),dec=permeabilityDecision(k);return `${pageTitle('2.2 Mesures de perméabilité — tests de Porchet')}<p>Les valeurs ci-dessous sont calculées à partir des relevés bruts enregistrés. Le protocole doit être validé par le professionnel.</p>${state.porchets.map((p,i)=>{const eq=state.photos.find(x=>x.id===p.equipmentPhotoId),site=state.photos.find(x=>x.id===p.sitePhotoId),series=porchetSeries(p);return `<h2>${esc(p.label)} — ${effectiveK(p)!==undefined?`${fmt(effectiveK(p),2)} mm/h`:'non calculé'}</h2><div class="photo-pair">${eq?`<figure><img src="${eq.data}"><figcaption>Matériel utilisé</figcaption></figure>`:'<div class="photo-placeholder">Photographie du matériel</div>'}${site?`<figure><img src="${site.data}"><figcaption>Essai sur site</figcaption></figure>`:'<div class="photo-placeholder">Photographie de l’essai</div>'}</div>${table([['Méthode',p.method==='constant_level'?'Niveau constant':'Valeur manuelle'],['Profondeur',`${p.depth||'—'} cm`],['Diamètre du trou',`${p.diameterCm||'—'} cm`],['Hauteur d’eau',`${p.waterHeightCm||'—'} cm`],['Saturation',`${p.saturationMin||'—'} min`],['Surface mouillée calculée',porchetAreaCm2(p)!==undefined?`${fmt(porchetAreaCm2(p),2)} cm²`:'—'],['Règle de rétention',p.retention],['Stabilité',p.stability],['K retenu',effectiveK(p)!==undefined?`${fmt(effectiveK(p),2)} mm/h`:'—']])}<table class="data-table"><thead><tr><th>Relevé</th><th>Durée</th><th>Volume</th><th>K</th></tr></thead><tbody>${p.readings.map((r,j)=>`<tr><td>${j+1}</td><td>${r.durationMin||'—'} min</td><td>${r.volumeMl||'—'} mL</td><td>${readingK(p,r)!==undefined?`${fmt(readingK(p,r),2)} mm/h`:'—'}</td></tr>`).join('')}</tbody></table><p><b>Interprétation :</b> ${esc(p.interpretation)}</p>`}).join('')}<div class="highlight"><b>Valeur représentative de l’étude :</b> ${k!==undefined?`${fmt(k,2)} mm/h`:'non calculée'}<br><b>Traitement par le sol :</b> ${dec.treatment}<br><b>Infiltration de l’effluent traité :</b> ${dec.infiltration}</div>`}

  function reportPorchetSummary(){const k=studyPermeability(),dec=permeabilityDecision(k);return `${pageTitle('2.2 Mesures de perméabilité — synthèse')}<p>Les valeurs sont calculées à partir des relevés bruts. La formule, le protocole et la valeur représentative restent soumis à validation professionnelle.</p>${table([['Nombre de tests',state.porchets.length],['Règle de valeur représentative',state.porchetSettings.studyRetention],['K retenu pour l’étude',k!==undefined?`${fmt(k,2)} mm/h`:'Non calculé'],['Traitement par le sol',dec.treatment],['Infiltration de l’effluent traité',dec.infiltration],['Protocole validé',state.porchetSettings.formulaValidated?'OUI':'NON'],['Note de validation',state.porchetSettings.formulaValidationNote||'—'],['Date de validation',dateFr(state.porchetSettings.formulaValidationDate)]])}`}

  function reportVentilation(){return `${pageTitle('3.2 Ventilation et principe de fonctionnement')}${state.report.schematics?ventilationSvg():''}<h2>3.3 Dispositif de traitement envisagé</h2>${state.report.schematics?ancSvg():''}`}
  function reportChoice(){const intermittent=state.solution.intermittentCompatible==='yes'?'Compatible':state.solution.intermittentCompatible==='no'?'Non compatible':'À confirmer';return `${pageTitle('3.4 Synthèse du choix de filière')}<table class="solution-table"><thead><tr><th>Critère</th><th>Filière traditionnelle</th><th>Filière agréée</th></tr></thead><tbody><tr><td>Type étudié</td><td>${esc(state.solution.traditionalType||'À étudier')}</td><td>${esc(state.solution.approvedType||'À étudier')}</td></tr><tr><td>Capacité</td><td>${esc(state.solution.capacity||'—')} EH</td><td>${esc(state.solution.capacity||'—')} EH minimum</td></tr><tr><td>Arbitrage</td><td colspan="2">${nl(state.solution.rejectionReason||state.automation.rationale||'À justifier')}</td></tr><tr><td>Dispositif précis</td><td colspan="2">${esc([state.solution.manufacturer,state.solution.model].filter(Boolean).join(' — ')||'À sélectionner')} — agrément ${esc(state.solution.approvalNumber||'à renseigner')}</td></tr><tr><td>Occupation intermittente</td><td colspan="2">${intermittent}</td></tr><tr><td>Solution retenue</td><td colspan="2"><b>${esc(state.solution.type||'À valider')}</b></td></tr></tbody></table><p>Le dispositif final doit respecter son agrément, son guide de pose, les contraintes hydrogéologiques et les prescriptions du gestionnaire compétent.</p>`}

  function reportEvacuationWorks(){return `${pageTitle('3.5 Traitement du rejet et emplacement')}${table([['Mode d’évacuation',evacuationLabel()],['Milieu récepteur',state.automation.evacuation.name],['Orientation',state.automation.evacuation.direction],['Gestionnaire / autorité',state.automation.evacuation.authority],['Autorisation',state.automation.evacuation.authorization],['Pente amont minimale',`${state.automation.evacuation.upstreamSlope||2} %`],['Emplacement proposé',state.solution.location]])}<p>${nl(state.automation.evacuation.conditions)}</p><h2>3.6 Préconisations concernant les travaux</h2>${table([['Type d’engins',state.solution.equipment],['Autorisation de passage',yesNo(state.automation.works.passage)],['Végétation à supprimer',yesNo(state.automation.works.vegetation)],['Zone à nettoyer',yesNo(state.automation.works.cleaning)],['Travaux intérieurs',`${yesNo(state.automation.works.internal)} — ${state.automation.works.internalText}`],['Conditions particulières',state.automation.works.special]],true)}`}
  function reportLimitations(){return `${pageTitle('3.7 Gestion des eaux pluviales')}<p>${nl(state.solution.rainwater)}</p><h1>3.8 Limites de l’étude</h1><p>${nl(state.solution.limitations||`Le diagnostic résulte de la synthèse des observations de terrain et de ${state.boreholes.length} sondage${state.boreholes.length>1?'s':''}. Il donne une vision générale du sous-sol sans exclure tous les aléas géologiques et ne constitue pas une étude géotechnique de fondation.`)}</p><h2>Validation professionnelle</h2>${table([['Validé',state.solution.validated?'OUI':'NON'],['Validé par',state.solution.validatedBy||'—'],['Date',state.solution.validationDate?new Date(state.solution.validationDate).toLocaleString('fr-FR'):'—'],['Note / réserves',state.solution.validationNote||'—']])}`}
  function reportMaintenance(){const m=state.automation.maintenance,items=[];if(m.septic)items.push(['Fosse toutes eaux','Contrôler le niveau des boues et faire intervenir une entreprise agréée lorsque les conditions de vidange sont atteintes.']);if(m.prefilter)items.push(['Préfiltre','Surveillance régulière, nettoyage et remplacement selon les prescriptions du fabricant.']);if(m.grease)items.push(['Bac à graisses','Surveillance et nettoyage périodiques adaptés à l’utilisation.']);if(m.lifting)items.push(['Poste de relevage','Contrôle du fonctionnement, de l’alarme et des flotteurs.']);if(m.treatment)items.push(['Dispositif de traitement','Vérifier l’écoulement et maintenir tous les regards accessibles.']);if(m.guide)items.push(['Dispositif agréé','Se référer au guide d’utilisation, de pose et d’entretien correspondant à l’agrément.']);return `${pageTitle('4. Entretien et conseils d’utilisation')}<h2>4.1 Utilisation courante</h2><p>Ne pas déverser d’essence, peinture, huiles, médicaments, acides ou produits incompatibles. Séparer les eaux pluviales des eaux usées.</p><h2>4.2 Entretien et maintenance</h2><div class="maint-grid">${items.map(x=>`<article><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></article>`).join('')}</div>`}
  function reportSynthesis(){const p=studyPermeability(),d=permeabilityDecision(p),r=geometryResults();return `${pageTitle('5. Fiche de synthèse')}${table([['Maître d’ouvrage',personName()],['Adresse projet',`${state.parcel.address} ${state.parcel.postalCode} ${state.parcel.city}`],['Longitude / Latitude',`${state.parcel.lat||'—'} / ${state.parcel.lng||'—'}`],['Type de projet',`${projectLabel()} d’un ANC${calculateEh()?` pour ${calculateEh()} EH`:''}`],['Surface de la parcelle',`${state.parcel.totalArea||'—'} m²`],['Surface disponible ANC',`${state.parcel.availableArea||'—'} m²`],['Topographie',state.automation.topography],['Géologie',`${state.parcel.geologyCode} — ${state.parcel.geologyText}`],['Hydrogéologie',state.automation.hydrogeology],['Hydraulique',state.automation.hydraulics],['Pédologie',state.automation.pedology],['Perméabilité retenue',p!==undefined?`${fmt(p,2)} mm/h`:'—'],['Aptitude traitement par le sol',d.treatment],['Aptitude infiltration effluent traité',d.infiltration],['Distance maison-filière',r.houseDistance!==undefined?`${fmt(r.houseDistance,1)} m`:'—'],['Distance filière-puits',r.wellDistance!==undefined?`${fmt(r.wellDistance,1)} m`:'Sans puits actif'],['Filière proposée',`${state.solution.type} — ${state.solution.capacity||'—'} EH`],['Fabricant / modèle',[state.solution.manufacturer,state.solution.model].filter(Boolean).join(' — ')||'À sélectionner'],['Agrément',state.solution.approvalNumber||'À renseigner'],['Évacuation de l’effluent',`${evacuationLabel()} — ${state.automation.evacuation.name}`]],false)}`}


  function reportMapPage(kind,title){return `${pageTitle(title)}${mapBlock(kind,title)}`}
  function trenchSvg(){const a=state.automation.annex3;return `<svg class="annex-diagram" viewBox="0 0 760 430"><rect x="20" y="20" width="720" height="390" rx="18" fill="#f5f0dc" stroke="#a9934b" stroke-width="3"/><rect x="70" y="55" width="125" height="80" rx="8" fill="#e4e9ed" stroke="#586977" stroke-width="4"/><text x="132" y="90" text-anchor="middle" font-weight="700">REGARD DE</text><text x="132" y="111" text-anchor="middle" font-weight="700">RÉPARTITION</text>${[0,1,2].map(i=>`<line x1="195" y1="95" x2="235" y2="${130+i*95}" stroke="#444" stroke-width="5"/><rect x="235" y="${100+i*95}" width="435" height="60" rx="25" fill="#d0bb7a" stroke="#725f2b" stroke-width="4"/><line x1="260" y1="${130+i*95}" x2="645" y2="${130+i*95}" stroke="#7198ba" stroke-width="7" stroke-dasharray="18 10"/>`).join('')}<text x="455" y="82" text-anchor="middle" font-size="18" font-weight="700">Largeur ${a.width} m — profondeur ${a.depth} m</text><text x="380" y="390" text-anchor="middle" font-size="19">Longueur totale : ${a.length?`${a.length} ml`:'à dimensionner'} — espacement ${a.spacing} m</text></svg>`}
  function reportAnnex3(){const a=state.automation.annex3;return `${pageTitle('8. Annexe 3 — tranchées d’infiltration à faible profondeur')}${trenchSvg()}<p>${nl(a.text)}</p>${table([['Largeur',`${a.width} m`],['Profondeur',`${a.depth} m`],['Espacement',`${a.spacing} m`],['Longueur totale',a.length?`${a.length} ml`:'À dimensionner'],['Regard de répartition',a.distribution?'OUI':'NON'],['Validation professionnelle',a.validated?'VALIDÉE':'À VALIDER']])}`}
  function reportPhotos(){return `${pageTitle('Annexe photographique')}<div class="photo-grid-report">${state.photos.slice(0,8).map(p=>`<figure><img src="${p.data}"><figcaption><b>${esc(p.title)}</b><br>${esc(p.caption)}</figcaption></figure>`).join('')}</div>`}

  function exportWord(){state.activeTab='rapport';render();setTimeout(()=>{const html=`<!doctype html><html><head><meta charset="utf-8"><style>${$('style')?.textContent||''}</style></head><body>${$('#report-pages').innerHTML}</body></html>`;download(`${safeFileName(state.reference)}-rapport-provisoire.doc`,'\ufeff'+html,'application/msword')},200)}

  function importPhoto(file,category='site'){return readImageCompressed(file).then(data=>({id:uid('photo'),category,title:file.name.replace(/\.[^.]+$/,''),caption:'',data,targetType:'',targetId:''}))}

  document.addEventListener('click',e=>{const tool=e.target.closest('[data-tool]');if(tool){editor.tool=tool.dataset.tool;$$('[data-tool]').forEach(b=>b.classList.toggle('tool-active',b===tool))}});
  render();
  recoverFromIndexedDb();
})();
</script>
</body>
</html>
