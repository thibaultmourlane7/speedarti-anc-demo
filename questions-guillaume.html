<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeedArti — Questions Plaquiste pour Guillaume</title>
  <style>
:root {
  --blue: #0b66ff;
  --blue-dark: #064cc4;
  --blue-soft: #eaf2ff;
  --navy: #10213f;
  --text: #24324a;
  --muted: #6e7b91;
  --line: #dfe5ee;
  --surface: #ffffff;
  --surface-soft: #f6f8fb;
  --success: #16865b;
  --warning: #a65d00;
  --danger: #c63838;
  --shadow: 0 16px 40px rgba(20, 45, 80, 0.10);
  --radius: 18px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { background: #eef2f7; }
body { margin: 0; color: var(--text); background: linear-gradient(180deg, #f8fbff 0, #eef2f7 100%); min-height: 100vh; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.app-shell { min-height: 100vh; }
.topbar {
  height: 78px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(14px);
}
.brand-block { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--blue), #6ba5ff);
  color: white; font-weight: 900; font-size: 22px;
  box-shadow: 0 10px 24px rgba(11,102,255,.26);
}
.brand-name { color: var(--navy); font-weight: 800; font-size: 20px; line-height: 1.1; }
.brand-subtitle { color: var(--muted); font-size: 12px; margin-top: 3px; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.status-chip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 999px; background: #eefaf5; color: var(--success); font-size: 12px; font-weight: 700; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px rgba(22,134,91,.12); }

.workspace { display: grid; grid-template-columns: 250px minmax(0, 1fr) 310px; min-height: calc(100vh - 78px); }
.sidebar { border-right: 1px solid var(--line); padding: 24px 18px; background: rgba(255,255,255,.58); }
.summary-panel { border-left: 1px solid var(--line); padding: 24px 18px; background: rgba(255,255,255,.45); }
.main-content { padding: 28px 32px 34px; min-width: 0; }

.project-card { padding: 16px; border-radius: 16px; background: linear-gradient(135deg, var(--navy), #1f3d70); color: white; margin-bottom: 24px; box-shadow: var(--shadow); }
.project-card .eyebrow { color: #b9c8e7; }
.project-card strong { display: block; margin: 6px 0; font-size: 15px; }
.project-card span:last-child { font-size: 12px; color: #d7e1f4; }
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: 10px; font-weight: 800; color: var(--blue); }

.stepper { display: flex; flex-direction: column; gap: 8px; }
.step-button { width: 100%; border: 0; background: transparent; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 13px; text-align: left; color: var(--muted); }
.step-button:hover { background: rgba(255,255,255,.8); }
.step-button.active { background: var(--surface); color: var(--navy); box-shadow: 0 8px 22px rgba(25,55,90,.08); }
.step-button.done .step-index { background: var(--success); color: white; border-color: var(--success); }
.step-index { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--line); background: white; font-size: 12px; font-weight: 800; }
.step-button.active .step-index { background: var(--blue); border-color: var(--blue); color: white; }
.step-label strong { display: block; font-size: 13px; color: inherit; }
.step-label span { display: block; font-size: 11px; margin-top: 2px; }
.safety-note { margin-top: 28px; padding: 14px; border: 1px dashed #b7c6dc; border-radius: 14px; background: rgba(255,255,255,.65); }
.safety-note strong { color: var(--navy); font-size: 12px; }
.safety-note p { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 6px 0 0; }

.step-content { max-width: 980px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.page-head h1 { margin: 5px 0 6px; color: var(--navy); font-size: clamp(24px, 3vw, 34px); line-height: 1.12; }
.page-head p { margin: 0; color: var(--muted); max-width: 720px; line-height: 1.55; }
.step-number-pill { flex: 0 0 auto; padding: 10px 14px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 12px; font-weight: 800; }

.card { background: var(--surface); border: 1px solid rgba(210,219,232,.9); border-radius: var(--radius); box-shadow: 0 10px 28px rgba(26,49,82,.06); padding: 22px; margin-bottom: 18px; }
.card.compact { padding: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 18px; }
.card-header h2, .card-header h3 { margin: 0; color: var(--navy); }
.card-header h2 { font-size: 18px; }
.card-header h3 { font-size: 15px; }
.card-header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

.form-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.field { grid-column: span 6; min-width: 0; }
.field.span-4 { grid-column: span 4; }
.field.span-3 { grid-column: span 3; }
.field.span-8 { grid-column: span 8; }
.field.full { grid-column: 1 / -1; }
.field label { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; font-weight: 750; color: var(--navy); }
.field-help { margin-top: 6px; color: var(--muted); font-size: 10px; line-height: 1.45; }
.field-tag { display: inline-flex; align-items: center; max-width: 100%; padding: 3px 6px; border-radius: 6px; background: #f0f4fa; color: #607089; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.input, .select, .textarea { width: 100%; border: 1px solid #ccd5e2; background: #fff; color: var(--text); border-radius: 11px; padding: 11px 12px; outline: none; transition: .18s ease; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(11,102,255,.10); }
.input.invalid, .select.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(198,56,56,.08); }
.textarea { min-height: 88px; resize: vertical; }
.input-group { display: flex; }
.input-group .input { border-radius: 11px 0 0 11px; }
.input-suffix { border: 1px solid #ccd5e2; border-left: 0; border-radius: 0 11px 11px 0; padding: 0 12px; display: grid; place-items: center; background: #f6f8fb; color: var(--muted); font-size: 12px; }

.segmented { display: inline-flex; background: #f0f4fa; padding: 4px; border-radius: 12px; gap: 4px; width: 100%; }
.segmented button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 9px 10px; font-size: 12px; font-weight: 700; }
.segmented button.active { background: white; color: var(--blue); box-shadow: 0 4px 12px rgba(38,62,90,.10); }
.check-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 0; border-bottom: 1px solid #edf0f4; }
.check-row:last-child { border-bottom: 0; }
.check-copy strong { display: block; font-size: 13px; color: var(--navy); }
.check-copy span { color: var(--muted); font-size: 11px; }
.switch { position: relative; width: 44px; height: 25px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track { position: absolute; inset: 0; background: #c7d0dd; border-radius: 999px; transition: .2s; }
.switch-track::after { content: ""; position: absolute; width: 19px; height: 19px; left: 3px; top: 3px; background: white; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,.2); transition: .2s; }
.switch input:checked + .switch-track { background: var(--blue); }
.switch input:checked + .switch-track::after { transform: translateX(19px); }

.btn { border: 0; border-radius: 11px; padding: 10px 14px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: .16s ease; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { color: white; background: linear-gradient(135deg, var(--blue), #2f7dff); box-shadow: 0 8px 18px rgba(11,102,255,.20); }
.btn-secondary { color: var(--navy); background: white; border: 1px solid #ced7e4; }
.btn-ghost { color: var(--blue); background: var(--blue-soft); }
.btn-danger { color: var(--danger); background: #fff0f0; }
.btn-small { padding: 7px 10px; font-size: 11px; }
.btn-block { width: 100%; margin-top: 18px; }

.item-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.item-tab { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 11px; padding: 9px 12px; font-size: 11px; font-weight: 750; }
.item-tab.active { background: var(--navy); border-color: var(--navy); color: white; }
.item-tab .mini-status { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: #9ba8ba; }
.item-tab.active .mini-status { background: #74f0bd; }
.wall-card { border: 1px solid #dfe5ee; border-radius: 15px; padding: 16px; margin-bottom: 12px; background: #fbfcfe; }
.wall-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.wall-card-head strong { color: var(--navy); font-size: 13px; }
.face-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.face-card { border: 1px solid #dfe5ee; border-radius: 14px; padding: 15px; background: white; }
.face-card.disabled { opacity: .52; filter: grayscale(.2); }
.face-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
.face-title strong { color: var(--navy); }

.inline-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.empty-state { border: 1px dashed #b9c5d6; border-radius: 15px; padding: 28px; text-align: center; color: var(--muted); background: #fafcff; }
.empty-state strong { display: block; color: var(--navy); margin-bottom: 5px; }

.alert { border-radius: 13px; padding: 13px 15px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px; border: 1px solid transparent; }
.alert strong { display: block; font-size: 12px; margin-bottom: 3px; }
.alert p { margin: 0; font-size: 11px; line-height: 1.45; }
.alert.blocking { background: #fff1f1; border-color: #f2c2c2; color: #8e2727; }
.alert.warning { background: #fff7ea; border-color: #f0d29f; color: #84500b; }
.alert.info { background: #eef5ff; border-color: #c8dcff; color: #215798; }
.global-alert-host { max-width: 980px; margin: 0 auto; }

.summary-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.sticky-card { position: sticky; top: 102px; }
.summary-title-row { display: flex; justify-content: space-between; align-items: flex-start; }
.summary-title-row h2 { margin: 4px 0 0; color: var(--navy); font-size: 18px; }
.engine-badge { padding: 6px 9px; background: var(--blue-soft); color: var(--blue); border-radius: 8px; font-size: 10px; font-weight: 900; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.metric { padding: 12px; border-radius: 12px; background: var(--surface-soft); }
.metric span { display: block; font-size: 10px; color: var(--muted); }
.metric strong { display: block; margin-top: 5px; font-size: 16px; color: var(--navy); }
.summary-divider { height: 1px; background: var(--line); margin: 16px 0; }
.summary-list { display: grid; gap: 11px; }
.summary-list > div { display: flex; justify-content: space-between; font-size: 12px; }
.summary-list span { color: var(--muted); }
.summary-list strong { color: var(--navy); }
.summary-hint { margin: 12px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }

.step-navigation { max-width: 980px; margin: 22px auto 0; display: flex; justify-content: space-between; align-items: center; }
.step-nav-right { display: flex; align-items: center; gap: 12px; }
.autosave-label { color: var(--muted); font-size: 10px; }

.result-hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; margin-bottom: 18px; }
.total-card { background: linear-gradient(135deg, var(--navy), #27508d); border-radius: 18px; color: white; padding: 22px; box-shadow: var(--shadow); }
.total-card span { color: #b9c9e8; font-size: 11px; }
.total-card strong { display: block; font-size: 34px; margin: 7px 0 4px; }
.total-card small { color: #dbe4f4; }
.kpi-stack { display: grid; gap: 10px; }
.kpi-box { border-radius: 14px; border: 1px solid var(--line); background: white; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
.kpi-box span { color: var(--muted); font-size: 11px; }
.kpi-box strong { color: var(--navy); }
.data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.data-table th { text-align: left; color: var(--muted); font-weight: 800; padding: 10px 9px; border-bottom: 1px solid var(--line); background: #f8fafc; }
.data-table td { padding: 10px 9px; border-bottom: 1px solid #edf0f4; vertical-align: top; }
.data-table tr:last-child td { border-bottom: 0; }
.money { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-flex; padding: 4px 7px; border-radius: 999px; font-size: 9px; font-weight: 800; }
.badge-success { background: #e8f7f1; color: var(--success); }
.badge-warning { background: #fff2d9; color: var(--warning); }
.badge-neutral { background: #edf1f6; color: #607089; }
.details { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; margin-bottom: 10px; }
.details summary { padding: 13px 15px; cursor: pointer; font-weight: 750; color: var(--navy); background: #fbfcfe; }
.details-body { padding: 14px; border-top: 1px solid var(--line); }
.code-block { white-space: pre-wrap; word-break: break-word; background: #10213f; color: #dce8ff; border-radius: 12px; padding: 14px; max-height: 380px; overflow: auto; font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

.toast { position: fixed; right: 24px; bottom: 24px; z-index: 100; min-width: 260px; max-width: 420px; padding: 14px 16px; border-radius: 13px; box-shadow: 0 18px 48px rgba(17,34,61,.22); background: var(--navy); color: white; animation: toastIn .25s ease; }
.toast.success { background: #116b4a; }
.toast.error { background: #9c3030; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (max-width: 1180px) {
  .workspace { grid-template-columns: 220px minmax(0,1fr); }
  .summary-panel { display: none; }
}
@media (max-width: 820px) {
  .topbar { height: auto; min-height: 72px; padding: 12px 16px; }
  .topbar-actions .status-chip, #saveDraftBtn { display: none; }
  .brand-subtitle { display: none; }
  .workspace { display: block; }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; overflow-x: auto; }
  .project-card, .safety-note { display: none; }
  .stepper { flex-direction: row; min-width: 700px; }
  .step-button { min-width: 110px; grid-template-columns: 28px 1fr; padding: 8px; }
  .step-index { width: 27px; height: 27px; border-radius: 9px; }
  .step-label span { display: none; }
  .main-content { padding: 20px 14px 28px; }
  .field, .field.span-4, .field.span-3, .field.span-8 { grid-column: 1 / -1; }
  .face-grid, .result-hero { grid-template-columns: 1fr; }
  .page-head { display: block; }
  .step-number-pill { display: inline-flex; margin-top: 12px; }
  .step-navigation { gap: 10px; }
  .step-nav-right { margin-left: auto; }
  .autosave-label { display: none; }
}
.is-hidden { display: none !important; }

/* V0.3.0 — écrans de validation métier et de préparation des connecteurs */
.compact-input { min-width: 150px; }
.compact-select { min-width: 130px; }
.utility-page { background: #f4f7fb; min-height: 100vh; }
.utility-topbar { position: sticky; top: 0; z-index: 30; }
.utility-main { width: min(1180px, calc(100% - 32px)); margin: 28px auto 64px; }
.utility-hero { max-width: none; background: white; border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); }
.progress-ring { width: 96px; height: 96px; flex: 0 0 96px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: conic-gradient(var(--blue) 0 25%, #e9eff8 25% 100%); color: var(--navy); }
.progress-ring strong { font-size: 20px; }
.progress-ring span { color: var(--muted); font-size: 10px; }
.question-list { display: grid; gap: 16px; }
.question-card { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.question-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 16px; }
.question-card-head h2 { margin: 5px 0 0; font-size: 18px; color: var(--navy); }
.status-select { width: 180px; flex: 0 0 180px; }
.decision-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.decision-context, .decision-question { border-radius: 13px; padding: 14px; font-size: 12px; line-height: 1.55; }
.decision-context { background: #eef5ff; border: 1px solid #c8dcff; color: #215798; }
.decision-question { background: #fff7ea; border: 1px solid #f0d29f; color: #84500b; }
.decision-context p, .decision-question p { margin: 6px 0 0; }
.compact-textarea { min-height: 72px; }
.connector-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0; }
.connector-card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.connector-card h2 { margin: 0; color: var(--navy); font-size: 17px; }
.connector-card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 11px; }
.connector-card code { font-size: 9px; background: #10213f; color: #dce8ff; padding: 9px; border-radius: 9px; overflow-wrap: anywhere; }
.connector-status { color: var(--success); font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
.engine-badge.large { font-size: 12px; padding: 10px 14px; }
.integration-steps { display: grid; gap: 12px; padding-left: 24px; }
.integration-steps li { padding: 10px 12px; background: var(--surface-soft); border-radius: 10px; }
.integration-steps strong, .integration-steps span { display: block; }
.integration-steps span { margin-top: 4px; color: var(--muted); font-size: 11px; }
.toast-host { position: fixed; right: 18px; bottom: 18px; z-index: 100; }

@media (max-width: 980px) {
  .connector-grid { grid-template-columns: 1fr 1fr; }
  .utility-topbar .topbar-actions { flex-wrap: wrap; justify-content: flex-end; }
}
@media (max-width: 700px) {
  .utility-main { width: min(100% - 20px, 1180px); margin-top: 14px; }
  .decision-grid, .connector-grid { grid-template-columns: 1fr; }
  .question-card-head { display: block; }
  .status-select { width: 100%; margin-top: 12px; }
  .progress-ring { margin-top: 18px; }
  .utility-topbar { align-items: flex-start; }
  .utility-topbar .topbar-actions { width: 100%; justify-content: flex-start; }
}
@media print {
  .utility-topbar, .toast-host { display: none !important; }
  .utility-page { background: white; }
  .utility-main { width: 100%; margin: 0; }
  .question-card { break-inside: avoid; box-shadow: none; }
  .status-select, textarea, input { border: 1px solid #999 !important; }
}

</style>
</head>
<body class="utility-page">
  <header class="topbar utility-topbar">
    <div class="brand-block"><div class="brand-mark">S</div><div><div class="brand-name">SpeedArti</div><div class="brand-subtitle">Plaquiste V2 — validation métier</div></div></div>
    <div class="topbar-actions">
      
      <button class="btn btn-secondary" id="exportJsonBtn" type="button">Exporter JSON</button>
      <button class="btn btn-secondary" id="exportMarkdownBtn" type="button">Exporter le compte rendu</button>
      <button class="btn btn-primary" id="printBtn" type="button">Imprimer</button>
    </div>
  </header>

  <main class="utility-main">
    <section class="page-head utility-hero">
      <div><span class="eyebrow">13 décisions encore ouvertes</span><h1>Questionnaire destiné à Guillaume</h1><p>Chaque réponse doit être exploitable sans interprétation. Tant qu’un point n’est pas validé, le moteur conserve son garde-fou actuel et n’invente aucune valeur.</p></div>
      <div class="progress-ring"><strong id="answeredCount">0/13</strong><span>validées</span></div>
    </section>

    <section class="card">
      <div class="form-grid">
        <div class="field span-4"><label>Nom du validateur</label><input class="input" id="validatorName" placeholder="Guillaume…" /></div>
        <div class="field span-4"><label>Date de validation</label><input class="input" id="validationDate" type="date" /></div>
        <div class="field span-4"><label>Version du questionnaire</label><input class="input" value="Plaquiste V2 — v0.3.0" disabled /></div>
      </div>
    </section>

    <section id="questionsHost" class="question-list"></section>
  </main>

  <div id="toastHost" class="toast-host"></div>
  <script>
const STORAGE_KEY = 'speedarti-plaquiste-v2-guillaume-questions-v030';

const questions = [
  {
    id: 'PLQ-DOUTE-001', title: 'Perte complémentaire sur les plaques',
    current: 'La valeur reste visible et réglée à 0 %. Les dimensions commerciales produisent déjà des chutes réelles.',

const state = loadState();
const host = document.querySelector('#questionsHost');
const validatorName = document.querySelector('#validatorName');
const validationDate = document.querySelector('#validationDate');
validatorName.value = state.validatorName ?? '';
validationDate.value = state.validationDate ?? '';

render();
validatorName.addEventListener('input', saveHeader);
validationDate.addEventListener('change', saveHeader);
document.querySelector('#exportJsonBtn').addEventListener('click', exportJson);
document.querySelector('#exportMarkdownBtn').addEventListener('click', exportMarkdown);
document.querySelector('#printBtn').addEventListener('click', () => window.print());

function render() {
  host.innerHTML = questions.map((question, index) => {
    const answer = state.answers?.[question.id] ?? { status: 'a_valider', response: '', note: '' };
    return `<article class="question-card" data-question="${question.id}">
      <div class="question-card-head"><div><span class="eyebrow">Question ${index + 1} · ${question.id}</span><h2>${escapeHtml(question.title)}</h2></div><select class="select status-select" data-status="${question.id}"><option value="a_valider" ${answer.status === 'a_valider' ? 'selected':''}>À valider</option><option value="valide" ${answer.status === 'valide' ? 'selected':''}>Validé</option><option value="refuse" ${answer.status === 'refuse' ? 'selected':''}>Refusé / à revoir</option></select></div>
      <div class="decision-grid">
        <div class="decision-context"><strong>Comportement sécurisé actuel</strong><p>${escapeHtml(question.current)}</p></div>
        <div class="decision-question"><strong>Décision demandée</strong><p>${escapeHtml(question.question)}</p></div>
      </div>
      <div class="form-grid">
        <div class="field full"><label>Réponse définitive de Guillaume</label><textarea class="textarea" data-response="${question.id}" placeholder="Réponse précise, unité, valeur, portée et cas particuliers…">${escapeHtml(answer.response)}</textarea></div>
        <div class="field full"><label>Note ou justification</label><textarea class="textarea compact-textarea" data-note="${question.id}" placeholder="Source fabricant, exemple chantier, réserve…">${escapeHtml(answer.note)}</textarea></div>
      </div>
    </article>`;
  }).join('');

  document.querySelectorAll('[data-status]').forEach((element) => element.addEventListener('change', () => updateAnswer(element.dataset.status, 'status', element.value)));
  document.querySelectorAll('[data-response]').forEach((element) => element.addEventListener('input', () => updateAnswer(element.dataset.response, 'response', element.value)));
  document.querySelectorAll('[data-note]').forEach((element) => element.addEventListener('input', () => updateAnswer(element.dataset.note, 'note', element.value)));
  updateProgress();
}

function updateAnswer(id, field, value) {
  state.answers ??= {};
  state.answers[id] ??= { status: 'a_valider', response: '', note: '' };
  state.answers[id][field] = value;
  persist();
  updateProgress();
}

function saveHeader() {
  state.validatorName = validatorName.value;
  state.validationDate = validationDate.value;
  persist();
}

function updateProgress() {
  const validated = questions.filter((question) => state.answers?.[question.id]?.status === 'valide' && state.answers?.[question.id]?.response?.trim()).length;
  document.querySelector('#answeredCount').textContent = `${validated}/${questions.length}`;
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '{}'); } catch { return {}; }
}

function exportJson() {
  download('Questionnaire_Guillaume_Plaquiste_v0.3.0.json', JSON.stringify(buildExport(), null, 2), 'application/json');
  toast('Questionnaire JSON exporté.');
}

function exportMarkdown() {
  const data = buildExport();
  const lines = [
    '# Validation métier — Module Plaquiste V2', '',
    `- Validateur : ${data.validatorName || 'Non renseigné'}`,
    `- Date : ${data.validationDate || 'Non renseignée'}`,
    `- Version : ${data.version}`, '',
  ];
  data.questions.forEach((item, index) => {
    lines.push(`## ${index + 1}. ${item.id} — ${item.title}`, '', `**Statut :** ${item.status}`, '', `**Comportement actuel :** ${item.current}`, '', `**Question :** ${item.question}`, '', `**Réponse :** ${item.response || 'Non renseignée'}`, '', `**Note :** ${item.note || '—'}`, '');
  });
  download('Compte_rendu_Guillaume_Plaquiste_v0.3.0.md', lines.join('\n'), 'text/markdown');
  toast('Compte rendu Markdown exporté.');
}

function buildExport() {
  return {
    version: '0.3.0', engine: 'plaquiste-v2', exportedAt: new Date().toISOString(),
    validatorName: validatorName.value, validationDate: validationDate.value,
    questions: questions.map((question) => ({ ...question, ...(state.answers?.[question.id] ?? { status: 'a_valider', response: '', note: '' }) })),
  };
}

function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const anchor = document.createElement('a'); anchor.href = url; anchor.download = name; anchor.click(); URL.revokeObjectURL(url);
}
function toast(message) {
  const element = document.createElement('div'); element.className = 'toast success'; element.textContent = message;
  document.querySelector('#toastHost').appendChild(element); setTimeout(() => element.remove(), 2500);
}
function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[char])); }

</script>
</body>
